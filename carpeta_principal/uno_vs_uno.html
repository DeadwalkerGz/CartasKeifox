<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CartasKeifox – Uno vs Uno</title>

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cantos.css">
    <link rel="stylesheet" href="css/uno_vs_uno.css">
</head>

<body>

    <!-- =============================== -->
    <!--            TÍTULO               -->
    <!-- =============================== -->
    <h1 style="text-align:center; margin-bottom:10px;">
        CartasKeifox – Modo 1 vs 1
    </h1>

    <!-- =============================== -->
    <!--        CONTENEDOR GENERAL       -->
    <!-- =============================== -->
    <div id="contenedor-juego">

        <!-- ===== MESA ===== -->
        <section id="mesa" style="margin-bottom:20px;">
            <!-- Las cartas de la mesa se renderizan desde JS -->
        </section>

        <!-- ===== CONTADOR DE CARTAS EN EL MAZO ===== -->
        <div id="contador-baraja"
            style="text-align:center; font-size:18px; margin-bottom:20px; margin-top:-10px; font-weight:bold; color:rgb(0, 0, 0);">
            Cartas en el mazo: 40
        </div>


        <!-- ===== JUGADORES ===== -->
        <section id="jugadores">
            <!-- Aquí se renderizan dinámicamente los jugadores -->
        </section>

    </div>

    <!-- =============================== -->
    <!--   PANEL LATERAL (CANTOS)        -->
    <!-- =============================== -->
    <div id="panel-cantos">
        <h3>Cantos disponibles</h3>
        <div id="cantos-lista"></div>
    </div>


    <!-- === 💥 PANEL DE DEPURACIÓN === -->
    <div id="debug-panel">
        <h3>🛠 Depuración Motor</h3>
        <pre id="debug-output">Cargando...</pre>
    </div>

    <!-- =============================== -->
    <!--   SCRIPTS DEL MOTOR + UI        -->
    <!-- =============================== -->

    <script src="js/main.js"></script>
    <script src="js/ui_uno_vs_uno.js"></script>

</body>

</html>
